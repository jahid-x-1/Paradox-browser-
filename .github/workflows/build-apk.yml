name: Build APK

on:
  push:
    branches:
      - 'arena/**'
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: gaming-tools
            label: Paradox Gaming Tools
            artifact: paradox-gaming-tools
            apk: gaming-tools/app/build/outputs/apk/debug/app-debug.apk
          - project: paradox-browser
            label: Paradox Browser
            artifact: paradox-browser
            apk: paradox-browser/app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          echo "SDK dir: $SDK"
          ls "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          if [ -d "$SDK/platform-tools" ]; then
            echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          fi

      - name: Install platform 34 and build tools
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found — relying on what the runner image ships"
            ls "$SDK/platforms" || true
            exit 0
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$SDK/platforms"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        working-directory: ${{ matrix.project }}
        run: bash -c 'echo "sdk.dir=${ANDROID_HOME}" > local.properties && gradle assembleDebug --no-daemon --stacktrace'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish APKs to release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Rename APKs
        run: |
          set -euo pipefail
          mkdir -p out
          cp apks/paradox-gaming-tools/app-debug.apk out/Paradox-Gaming-Tools-1.0.0-debug.apk
          cp apks/paradox-browser/app-debug.apk out/Paradox-Browser-1.0.0-debug.apk
          ls -lh out

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK builds
          body: |
            Automated debug builds from `${{ github.ref_name }}` at `${{ github.sha }}`.

            * **Paradox-Gaming-Tools-1.0.0-debug.apk** — real lag reduction (Linear JAH-5)
            * **Paradox-Browser-1.0.0-debug.apk** — hardened WebView browser

            Debug builds are signed with the standard debug keystore, so Android will warn
            that the app comes from an unknown source. Allow "Install unknown apps" for your
            file manager or browser to install it.
          files: out/*.apk
          prerelease: true
          make_latest: false
