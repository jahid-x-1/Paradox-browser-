plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.paradox.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.paradox.browser"
        minSdk 21   // FIX: Via was 19 (old, vulnerable WebView) → 21 (Lollipop)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Paradox Browser - by Jahid Hasan (paradox)
        buildConfigField "String", "DEVELOPER_NAME", '"Jahid Hasan (paradox)"'
        buildConfigField "String", "APP_NAME", '"Paradox Browser"'
        buildConfigField "String", "HOME_URL", '"https://www.google.com"'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
